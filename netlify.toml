# Manual deploy only; no build command. The publish directory is pinned so a bare `netlify deploy`
# from the repository root can never upload tables/, testdata/ or any other Roland-derived local
# data — only what Vite built.
#
# To publish:
#   wsl cmake --preset web && wsl cmake --build --preset web   # the engine, from WSL
#   cd web && npm run build                                    # the app
#   netlify deploy --prod --dir=web/dist
[build]
  publish = "web/dist"

# Vite content-hashes everything under assets/ — js, css and the engine wasm alike — so they are
# immutable by construction and can be cached forever. index.html is the one mutable entry point.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Client-side routing: a reload or a deep link on /live must answer 200 with the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
