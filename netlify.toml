# No build command: Netlify never builds this site. `.github/workflows/web.yml` builds the engine
# and the app on a push to main and uploads the result with `--no-build`, so what lands here is
# always something Vite produced on a runner.
#
# The publish directory is pinned anyway, because that workflow is not the only way a deploy can
# happen. A `netlify deploy` run by hand from the repository root — to check a branch, or when the
# runner is unavailable — takes its scope from this file, and pinning it means such a deploy can
# never upload tables/, testdata/ or any other Roland-derived local data.
[build]
  publish = "web/dist"

# Vite content-hashes everything under assets/ — js, css and the engine wasm alike — so they are
# immutable by construction and can be cached forever. index.html is the one mutable entry point.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify has no MIME mapping for .webmanifest and falls back to application/octet-stream. Every
# browser in current use parses the manifest regardless of what it is served as, so this corrects
# a spec violation rather than a fault — but it is the type the manifest spec names, and a stricter
# client would be entitled to refuse the other one.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# Client-side routing: a reload or a deep link on /live must answer 200 with the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
