     with the Doxygen version pinned in .github/workflows/docs.yml. -->

<script type="text/javascript">
    // Each of those three wraps its init() in jQuery -- $(fn), $(document).ready(fn) and, in the
    // toggle, $(window).resize(fn). Doxygen has not shipped jQuery since 1.11, so on 1.17 the
    // first call throws ReferenceError, takes the other two down with it, and the theme silently
    // loses its dark-mode toggle, its copy buttons and its heading anchors. Those three call
    // shapes are the whole of the dependency, and every one of them means "run this when the DOM
    // is ready" or "run this on resize", so that is all this stands in for. It is deliberately not
    // a jQuery: anything else the vendored scripts might one day ask of $ should fail loudly here
    // rather than quietly do the wrong thing.
    function $(target) {
        const whenReady = (callback) => {
            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", callback, { once: true })
            } else {
                callback()
            }
        }

        if (typeof target === "function") {
            whenReady(target)
            return
        }

        return {
            ready: whenReady,
            resize: (callback) => window.addEventListener("resize", callback),
        }
    }

    DoxygenAwesomeDarkModeToggle.init()
    DoxygenAwesomeFragmentCopyButton.init()
    DoxygenAwesomeParagraphLink.init()
</script>
