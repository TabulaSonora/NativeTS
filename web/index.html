<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabula Sonora</title>

    <!--
        Icons, served from the site root by Vite's public/ directory. The .ico carries 16/32/48 for
        legacy browsers and the bookmarks bar; the PNGs are what a modern browser actually picks
        from. Only apple-touch-icon and the maskable manifest entries are opaque — the master art
        is a full-bleed squircle with transparent corners, which is right for a favicon drawn on an
        unknown background and wrong where the OS composites the icon behind a mask of its own,
        because there the corner shows through as a black wedge.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
        The colour the browser tints its own chrome with. These are the page background from
        losnoco.css, not the icon's orange: the bar sits directly above the page, and a colour that
        is not the page's reads as a seam. A visitor who has forced a theme against their system
        setting gets the system one here — the meta tag can only follow prefers-color-scheme.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F3F0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111C1A" />

    <!--
        The typefaces are served from LoSnoCo's own host rather than bundled, so the connection and
        the stylesheets are worth starting before the parser reaches the links that need them.
        Nothing here carries any of the user's data: these are font files, and the DLL is read and
        cached locally exactly as the page says.
    -->
    <link rel="preconnect" href="https://assets.losno.co" crossorigin />
    <link rel="preload" as="style" href="https://assets.losno.co/fonts/inter/stylesheet.css" />
    <link rel="preload" as="style" href="https://assets.losno.co/fonts/IosevkaLoSnoCo/IosevkaLoSnoCo.css" />
    <link rel="preload" as="style" href="https://assets.losno.co/fonts/IosevkaLoSnoCoNoLig/IosevkaLoSnoCoNoLig.css" />
    <link rel="preload" as="style" href="https://assets.losno.co/fonts/IosevkaLoSnoCoNoLigQp/IosevkaLoSnoCoNoLigQp.css" />

    <script>
        // The theme has to be settled before the first paint, which is why this is inline and why it
        // sits ABOVE the stylesheet links rather than below them: a script that follows a pending
        // <link rel="stylesheet"> is blocked until that sheet loads, so putting it lower would park
        // the decision behind a network fetch and paint the wrong palette in the meantime.
        //
        // It owns the storage key and the apply step, and the theme toggle calls back into it, so
        // neither is written down twice. Same key as the previous deployment of this page, so a
        // returning visitor's choice carries over.
        (function () {
            const KEY = 'tabula-sonora.theme';

            function apply(choice) {
                // No attribute is the third state rather than a missing one: the stylesheet themes
                // the page from prefers-color-scheme by default, and only its data-theme helpers
                // override that, so removing the attribute IS "follow the system".
                if (choice === 'light' || choice === 'dark') {
                    document.documentElement.setAttribute('data-theme', choice);
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
            }

            globalThis.tabulaTheme = {
                // Storage access throws rather than returning null where the browser has disabled
                // it, and a colour preference is not worth failing the page over.
                get() {
                    try {
                        return localStorage.getItem(KEY) || 'auto';
                    } catch {
                        return 'auto';
                    }
                },

                set(choice) {
                    apply(choice);

                    try {
                        if (choice === 'light' || choice === 'dark') {
                            localStorage.setItem(KEY, choice);
                        } else {
                            localStorage.removeItem(KEY);
                        }
                    } catch {
                        // The choice still holds for this page view; it just will not be remembered.
                    }
                },
            };

            apply(globalThis.tabulaTheme.get());
        })();
    </script>

    <link rel="stylesheet" href="https://assets.losno.co/fonts/inter/stylesheet.css" />
    <link rel="stylesheet" href="https://assets.losno.co/fonts/IosevkaLoSnoCo/IosevkaLoSnoCo.css" />
    <link rel="stylesheet" href="https://assets.losno.co/fonts/IosevkaLoSnoCoNoLig/IosevkaLoSnoCoNoLig.css" />
    <link rel="stylesheet" href="https://assets.losno.co/fonts/IosevkaLoSnoCoNoLigQp/IosevkaLoSnoCoNoLigQp.css" />
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
